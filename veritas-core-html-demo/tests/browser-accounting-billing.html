<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Veritas accounting and billing browser audit</title><link rel="stylesheet" href="../css/style.css"><link rel="stylesheet" href="../css/fidelity.css"><style>#audit-result{position:fixed;z-index:9999;top:0;left:0;width:100%;max-height:100vh;overflow:auto;padding:20px;background:#fff;white-space:pre-wrap;font:16px monospace}</style></head><body><div id="app"></div><div id="modal-root"></div><div id="toasts"></div><pre id="audit-result">RUNNING</pre><script>localStorage.removeItem('veritas-core-demo-v1');localStorage.setItem('veritas-core-demo-user','u3');location.hash='#/ledger'</script><script src="../js/data.js"></script><script src="../js/app.js"></script><script>
(async()=>{const results=[],pause=()=>new Promise(r=>setTimeout(r,45)),db=()=>JSON.parse(localStorage.getItem('veritas-core-demo-v1')),check=(name,pass)=>results.push({name,pass:!!pass}),go=async hash=>{location.hash=hash;await pause()},submit=async()=>{document.querySelector('#modal-form').requestSubmit();await pause()},confirm=async selector=>{document.querySelector(selector).click();await submit()};try{
document.querySelector('[data-create="ledger"]').click();document.querySelector('#f-memo').value='Browser audit service revenue';const lines=[...document.querySelectorAll('#journal-lines .line-row')];lines[0].querySelector('[name="debit"]').value='100';lines[0].querySelector('[name="credit"]').value='0';lines[1].querySelector('[name="debit"]').value='0';lines[1].querySelector('[name="credit"]').value='100';await submit();const journal=db().journals.find(j=>j.memo==='Browser audit service revenue');check('bookkeeper journal draft created',!!journal&&journal.creator==='u3'&&journal.status==='Draft');
await go(`#/ledger/${journal.id}`);await confirm(`[data-flow="submit:${journal.id}"]`);check('balanced journal submitted',db().journals.find(j=>j.id===journal.id).status==='For Review');
await go('#/vouchers');document.querySelector('[data-create="vouchers"]').click();document.querySelector('#f-description').value='Browser audit journal voucher';const voucherLines=[...document.querySelectorAll('#journal-lines .line-row')];voucherLines[0].querySelector('[name="debit"]').value='50';voucherLines[0].querySelector('[name="credit"]').value='0';voucherLines[1].querySelector('[name="debit"]').value='0';voucherLines[1].querySelector('[name="credit"]').value='50';await submit();const voucher=db().vouchers.find(v=>v.description==='Browser audit journal voucher');check('journal voucher and linked journal created',!!voucher&&voucher.type==='JV'&&!!db().journals.find(j=>j.id===voucher.journal));document.querySelector(`[data-edit="vouchers:${voucher.id}"]`).click();document.querySelector('#f-description').value='Browser audit JV edited';await submit();check('JV draft voucher edited',db().vouchers.find(v=>v.id===voucher.id).description==='Browser audit JV edited');
for(const type of ['CV','CR','CD']){await go('#/vouchers');document.querySelector('[data-create="vouchers"]').click();document.querySelector('#f-type').value=type;document.querySelector('#f-payee').value='Fictional Party';document.querySelector('#f-amount').value='50';document.querySelector('#f-cashAccount').value='a1000-c1';document.querySelector('#f-description').value=`Browser audit ${type} voucher`;if(type==='CV'){document.querySelector('#f-checkNumber').value='DEMO-CV-9001';document.querySelector('#f-checkDate').value=new Date().toISOString().slice(0,10)}const rows=[...document.querySelectorAll('#journal-lines .line-row')],receipt=type==='CR';rows[0].querySelector('[name="debit"]').value=receipt?'50':'0';rows[0].querySelector('[name="credit"]').value=receipt?'0':'50';rows[1].querySelector('[name="debit"]').value=receipt?'0':'50';rows[1].querySelector('[name="credit"]').value=receipt?'50':'0';await submit();const item=db().vouchers.find(v=>v.description===`Browser audit ${type} voucher`);check(`${type} voucher and linked journal created`,!!item&&item.type===type&&!!db().journals.find(j=>j.id===item.journal));document.querySelector(`[data-edit="vouchers:${item.id}"]`).click();document.querySelector('#f-description').value=`Browser audit ${type} edited`;await submit();check(`${type} draft voucher edited`,db().vouchers.find(v=>v.id===item.id).description===`Browser audit ${type} edited`)}
document.querySelector('[data-action="logout"]').click();await submit();document.querySelector('#email').value='manager@demo.veritas.local';document.querySelector('#password').value='demo';document.querySelector('#login-form').requestSubmit();await pause();check('manager signed in for independent review',document.querySelector('.profile-copy')?.textContent.includes('Office Manager'));
await go(`#/ledger/${journal.id}`);await confirm(`[data-flow="review:${journal.id}"]`);check('manager reviewed different creator',db().journals.find(j=>j.id===journal.id).status==='Reviewed');await confirm(`[data-flow="post:${journal.id}"]`);check('manager posted reviewed journal',db().journals.find(j=>j.id===journal.id).status==='Posted');check('posted journal edit hidden',!document.querySelector(`[data-edit="ledger:${journal.id}"]`));
await go('#/general?client=c1');document.querySelector('#general-account-form [name="account"]').value='a1000-c1';document.querySelector('#general-account-form').requestSubmit();await pause();check('posted entry visible in General Ledger',document.querySelector('#main')?.textContent.includes('Browser audit service revenue'));
await go('#/billing');document.querySelector('[data-create="billing"]').click();document.querySelector('#f-client').value='c1';document.querySelector('#invoice-items [name="price"]').value='1000';await submit();const invoice=db().invoices.at(-1);check('invoice draft with item created',invoice?.client==='c1'&&invoice.status==='Draft');await go(`#/billing/${invoice.id}`);await confirm(`[data-flow="issue:${invoice.id}"]`);check('invoice issued Open',db().invoices.find(i=>i.id===invoice.id).status==='Open');
document.querySelector(`[data-flow="payment:${invoice.id}"]`).click();document.querySelector('#f-amount').value='400';await submit();check('partial payment recorded',db().invoices.find(i=>i.id===invoice.id).payments.length===1);document.querySelector(`[data-flow="payment:${invoice.id}"]`).click();document.querySelector('#f-amount').value='700';await submit();check('overpayment rejected',db().invoices.find(i=>i.id===invoice.id).payments.length===1);document.querySelector('#f-amount').value='600';await submit();check('full payment closes balance',db().invoices.find(i=>i.id===invoice.id).payments.length===2&&document.querySelector('#main')?.textContent.includes('Paid'));
}catch(error){results.push({name:'browser exception',pass:false,error:String(error)})}const count=results.filter(x=>x.pass).length;document.querySelector('#audit-result').textContent=`${count}/${results.length} PASS\n`+results.map(x=>`${x.pass?'PASS':'FAIL'} ${x.name}${x.error?' — '+x.error:''}`).join('\n');document.body.dataset.audit=count===results.length?'PASS':'FAIL'})()
</script></body></html>
