<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Veritas browser audit</title><link rel="stylesheet" href="../css/style.css"><link rel="stylesheet" href="../css/fidelity.css"><style>#audit-result{position:fixed;z-index:9999;top:0;left:0;width:100%;max-height:100vh;overflow:auto;padding:20px;background:#fff;white-space:pre-wrap;font:16px monospace}</style></head><body><div id="app"></div><div id="modal-root"></div><div id="toasts"></div><pre id="audit-result">RUNNING</pre><script>localStorage.removeItem('veritas-core-demo-v1');localStorage.removeItem('veritas-core-demo-user');sessionStorage.removeItem('veritas-core-demo-user');location.hash='#/dashboard'</script><script src="../js/data.js"></script><script src="../js/app.js"></script><script>
(async()=>{const results=[];const wait=()=>new Promise(resolve=>setTimeout(resolve,30));const check=(name,pass)=>results.push({name,pass:!!pass});const login=async email=>{document.querySelector('#email').value=email;document.querySelector('#password').value='demo';document.querySelector('#login-form').requestSubmit();await wait()};const logout=async()=>{document.querySelector('[data-action="logout"]').click();await wait();document.querySelector('#modal-form').requestSubmit();await wait()};try{
check('login screen',!!document.querySelector('#login-form'));
await login('owner@demo.veritas.local');check('owner dashboard',!!document.querySelector('.shell')&&document.querySelector('#main')?.textContent.includes('Owner overview'));check('owner administration visible',document.querySelector('nav')?.textContent.includes('User Management')&&document.querySelector('nav')?.textContent.includes('Workspace'));await logout();check('logout returns login',!!document.querySelector('#login-form'));
await login('manager@demo.veritas.local');check('manager role switch',document.querySelector('.profile-copy')?.textContent.includes('Office Manager'));check('manager no owner administration',!document.querySelector('nav')?.textContent.includes('User Management')&&!document.querySelector('nav')?.textContent.includes('Workspace'));location.hash='#/doc-templates';await wait();check('manager requirement templates',!!document.querySelector('#new-doc-template-form'));await logout();
await login('bookkeeper@demo.veritas.local');check('bookkeeper role switch',document.querySelector('.profile-copy')?.textContent.includes('Bookkeeper'));check('bookkeeper chart visible',document.querySelector('nav')?.textContent.includes('Chart of Accounts'));location.hash='#/accounts';await wait();check('bookkeeper chart read only',!!document.querySelector('#list-client')&&!document.querySelector('[data-create="accounts"]'));location.hash='#/clients/c2';await wait();check('unassigned client blocked',document.querySelector('#main')?.textContent.includes('Record unavailable'));check('no owner state after switch',!document.querySelector('nav')?.textContent.includes('Audit Logs'));
location.hash='#/requirements/r1';await wait();document.querySelector('[data-flow="followup:requirements:r1"]').click();document.querySelector('#f-status').value='In Progress';document.querySelector('#f-assignedTo').value='u3';document.querySelector('#f-remarks').value='Browser evidence request';document.querySelector('#modal-form').requestSubmit();await wait();check('requirement follow-up created',document.querySelector('#main')?.textContent.includes('Browser evidence request'));document.querySelector('[data-flow^="edit-followup:requirements:r1:"]').click();document.querySelector('#f-status').value='Resolved';document.querySelector('#modal-form').requestSubmit();await wait();check('requirement follow-up edited',document.querySelector('#main')?.textContent.includes('Resolved'));document.querySelector('[data-flow^="delete-followup:requirements:r1:"]').click();document.querySelector('#modal-form').requestSubmit();await wait();check('requirement follow-up deleted',!document.querySelector('#main')?.textContent.includes('Browser evidence request'));
location.hash='#/compliance/co1';await wait();document.querySelector('[data-flow="followup:compliance:co1"]').click();document.querySelector('#f-assignedTo').value='u3';document.querySelector('#f-followUpDate').value='2026-10-20';document.querySelector('#f-remarks').value='Browser filing reminder';document.querySelector('#modal-form').requestSubmit();await wait();check('compliance follow-up created',document.querySelector('#main')?.textContent.includes('Browser filing reminder'));document.querySelector('[data-flow^="edit-followup:compliance:co1:"]').click();document.querySelector('#f-status').value='Resolved';document.querySelector('#modal-form').requestSubmit();await wait();check('compliance follow-up edited',document.querySelector('#main')?.textContent.includes('Resolved'));document.querySelector('[data-flow^="delete-followup:compliance:co1:"]').click();document.querySelector('#modal-form').requestSubmit();await wait();check('compliance follow-up deleted',!document.querySelector('#main')?.textContent.includes('Browser filing reminder'));
}catch(error){results.push({name:'browser exception',pass:false,error:String(error)})}const passed=results.filter(x=>x.pass).length;document.querySelector('#audit-result').textContent=`${passed}/${results.length} PASS\n`+results.map(x=>`${x.pass?'PASS':'FAIL'} ${x.name}${x.error?' — '+x.error:''}`).join('\n');document.body.dataset.audit=results.every(x=>x.pass)?'PASS':'FAIL';window.__auditDone=true})()
</script></body></html>
