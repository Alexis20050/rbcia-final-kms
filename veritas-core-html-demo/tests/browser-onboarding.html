<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Veritas onboarding browser audit</title><link rel="stylesheet" href="../css/style.css"><link rel="stylesheet" href="../css/fidelity.css"><style>#audit-result{position:fixed;z-index:9999;top:0;left:0;width:100%;max-height:100vh;overflow:auto;padding:20px;background:#fff;white-space:pre-wrap;font:16px monospace}</style></head><body><div id="app"></div><div id="modal-root"></div><div id="toasts"></div><pre id="audit-result">RUNNING</pre><script>localStorage.removeItem('veritas-core-demo-v1');localStorage.setItem('veritas-core-demo-user','u1');location.hash='#/clients'</script><script src="../js/data.js"></script><script src="../js/app.js"></script><script>
(async()=>{const results=[],pause=()=>new Promise(r=>setTimeout(r,45)),db=()=>JSON.parse(localStorage.getItem('veritas-core-demo-v1')),check=(name,pass)=>results.push({name,pass:!!pass}),go=async hash=>{location.hash=hash;await pause()},submit=async()=>{document.querySelector('#modal-form').requestSubmit();await pause()};try{
document.querySelector('[data-create="clients"]').click();for(const [name,value] of Object.entries({name:'Fictional Browser Audit Client',contact:'Demo Contact',email:'browser-audit@example.test',phone:'09170000000',tin:'999-999-999-000'}))document.querySelector(`#f-${name}`).value=value;await submit();const client=db().clients.find(c=>c.name==='Fictional Browser Audit Client');check('client created by Owner',!!client&&client.onboardedAt===null);
await go('#/doc-templates');const apply=document.querySelector('.template-apply-form');apply.querySelector('[name="client"]').value=client.id;apply.requestSubmit();await pause();const requirement=db().requirements.find(r=>r.client===client.id);check('required template applied',!!requirement&&requirement.required&&requirement.status==='Missing');
await go('#/documents');document.querySelector('[data-create="documents"]').click();document.querySelector('#f-client').value=client.id;document.querySelector('#f-title').value='Fictional registration evidence';await submit();const doc=db().documents.find(d=>d.client===client.id);check('client document created',!!doc&&doc.status==='Submitted');
await go(`#/requirements/${requirement.id}`);document.querySelector(`[data-flow="link-doc:${requirement.id}"]`).click();document.querySelector('#f-document').value=doc.id;await submit();check('document linked to requirement',db().requirements.find(r=>r.id===requirement.id).linkedDocuments.includes(doc.id));
await go(`#/clients/${client.id}`);check('onboarding blocked before validation',!document.querySelector(`[data-flow="activate:${client.id}"]`));await go(`#/documents/${doc.id}`);document.querySelector(`[data-flow="validate-doc:${doc.id}"]`).click();document.querySelector('#f-status').value='Approved';await submit();check('document approval verifies requirement',db().requirements.find(r=>r.id===requirement.id).status==='Verified');
await go(`#/clients/${client.id}`);document.querySelector(`[data-flow="activate:${client.id}"]`).click();await submit();const completed=db().clients.find(c=>c.id===client.id);check('client onboarding completed',!!completed.onboardedAt&&completed.status==='Inactive');check('onboarding persisted locally',!!JSON.parse(localStorage.getItem('veritas-core-demo-v1')).clients.find(c=>c.id===client.id).onboardedAt);
}catch(error){results.push({name:'browser exception',pass:false,error:String(error)})}const count=results.filter(x=>x.pass).length;document.querySelector('#audit-result').textContent=`${count}/${results.length} PASS\n`+results.map(x=>`${x.pass?'PASS':'FAIL'} ${x.name}${x.error?' — '+x.error:''}`).join('\n');document.body.dataset.audit=count===results.length?'PASS':'FAIL'})()
</script></body></html>
